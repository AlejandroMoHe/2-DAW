<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Ejercicio 6 </title>
        <style type="text/css">
            div#paginacion{
                display: inline-block;
                font-weight: bold;
                background-color: lightgray;
                padding: 0.75rem;
                border-style: solid;
                border-color: gray;
                border-width: 1px;
            }
            .derecha{
                padding-left: 8rem;
            }
            .izquierda{
                padding-right: 8rem;
            }
            div.clear{
                clear: both;
            }
        </style>
    </head>
    <body>
        <div id="paginacion">
            <span class="izquierda">&laquo; Anterior</span>
            <span class="derecha">Siguiente &raquo;</span>
            <div class="clear"></div>
        </div>
    </body>
</html>
