<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de al menos 5</title>
</head>
<body>
    
    <form>

        <label id="nombre">Nombre: </label>
        <input type="text" name="nombre" id="nombre"><br>

        <label id="edad">Edad: </label>
        <input type="date" name="edad" id="edad"><br>

        <label id="hermanos">Nº de Hermanos: </label>
        <input type="number" name="hermanos" id="hermanos"><br>

        <label >Cual es tu genero: </label><br>
        <label for="generoH">Hombre</label>
        <input type="radio" name="generoH" id="generoH">
        <label for="generoM">Mujer</label>
        <input type="radio" name="generoM" id="generoM"><br>

        <label id="foto">Adjunta una foto tuya: </label>
        <input type="file" name="foto" id="foto">

    </form>

</body>
</html>
